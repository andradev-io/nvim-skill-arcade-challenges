<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arcade.nvim</title>
    <meta name="description" content="Train your Neovim with your own keybinds: design, play and share challenges for nvim-skill-arcade." />
    <meta name="theme-color" content="#121212" />
    <meta property="og:site_name" content="arcade.nvim" />
    <meta property="og:title" content="arcade.nvim" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the color scheme before the first paint, so a dark-mode visitor never sees a white flash.
      // Same storage key and class names MUI uses (colorSchemeSelector: 'class').
      try {
        var m = localStorage.getItem('mui-mode') || 'system';
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      html.dark body { background: #121212; color: #f5f5f5; }
      html.light body { background: #ffffff; color: #222222; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
