name: daily challenges

# Every day a model writes new challenges; only the ones that pass the same gates as a pull request (schema, replay of
# the reference solution in real Neovim, de-duplication) are kept, and they arrive as a pull request for review.
# Setup and the kill switch are described in CONTRIBUTING.md ("Daily challenges").

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate and print the result, publish nothing"
        type: boolean
        default: true
      model:
        description: "Model id for this run only (overrides ANTHROPIC_MODEL, _HARD and _FALLBACK)"
        required: false
        type: string
      prompt_extra:
        description: "Extra guidance appended to the prompt for this run only (1000 characters at most)"
        required: false
        type: string
      count:
        description: "On demand: how many challenges to publish (3 to 20, default 3)"
        required: false
        type: string
      areas:
        description: "On demand: comma list of areas, e.g. search,marks,macros (default: today's rotation)"
        required: false
        type: string
      levels:
        description: "On demand: comma list of levels 1-5, e.g. 2,3,4 (default: today's rotation)"
        required: false
        type: string
      languages:
        description: "On demand: languages for refactor-style code, comma list, e.g. typescript,go,cs (default: all of lua, python, javascript, typescript, go, cs)"
        required: false
        type: string
      theme:
        description: "On demand: a topic or creative premise, e.g. 'tabletop RPG notes' (160 characters at most)"
        required: false
        type: string
      budget_seconds:
        description: "On demand: time budget per batch in seconds (default 300, at most 900); raise it for big requests"
        required: false
        type: string
      date:
        description: "Day to write for, YYYY-MM-DD (default: today, UTC)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write # lets the run start the validation workflow on the branch it pushes

concurrency:
  group: daily-challenges

jobs:
  generate:
    # Kill switch: nothing runs unless the repository variable DAILY_ENABLED is exactly "true".
    if: ${{ vars.DAILY_ENABLED == 'true' }}
    runs-on: andradev-io # self-hosted ARC runner (homelab): the Anthropic org allowlists its IP, not the GitHub-hosted ones
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # the engine that judges challenges is the plugin itself
      - uses: actions/checkout@v4
        with:
          repository: andradev-io/nvim-skill-arcade
          path: .plugin
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write, gate and keep the survivors
        id: gen
        # The only step that sees the API key. It reaches the generator as an environment variable and is never printed;
        # the replay of the model's keys runs in a child process that is given no secrets.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_URL: ${{ vars.ANTHROPIC_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_MODEL_FALLBACK: ${{ vars.ANTHROPIC_MODEL_FALLBACK }}
          ANTHROPIC_MODEL_HARD: ${{ vars.ANTHROPIC_MODEL_HARD }}
          ANTHROPIC_MODELS_EXTRA: ${{ vars.ANTHROPIC_MODELS_EXTRA }}
          DAILY_MODEL_TIMEOUT_SECONDS: ${{ vars.DAILY_MODEL_TIMEOUT_SECONDS }}
          DAILY_BATCH_BUDGET_SECONDS: ${{ inputs.budget_seconds || vars.DAILY_BATCH_BUDGET_SECONDS }}
          DAILY_MODEL: ${{ inputs.model }}
          DAILY_PROMPT_EXTRA: ${{ vars.DAILY_PROMPT_EXTRA }}
          DAILY_PROMPT_EXTRA_RUN: ${{ inputs.prompt_extra }}
          DAILY_PR_BODY: ${{ runner.temp }}/pr-body.md
          DAILY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DAILY_DATE: ${{ inputs.date }}
          DAILY_PUBLISH: ${{ inputs.count }}
          DAILY_AREAS: ${{ inputs.areas }}
          DAILY_LEVELS: ${{ inputs.levels }}
          DAILY_THEME: ${{ inputs.theme }}
          DAILY_LANGUAGES: ${{ inputs.languages }}
          ARCADE_PLUGIN: .plugin
        run: |
          set -o pipefail
          node scripts/generate-daily.mjs | tee "$RUNNER_TEMP/daily.log"
      - name: Show the log in the run summary
        if: always()
        run: |
          {
            echo '### Daily challenges'
            echo '```'
            cat "$RUNNER_TEMP/daily.log" 2>/dev/null || echo 'no log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate the whole set again before anything is proposed
        # the generator gates each challenge on its own; this is the same validator the pull-request check runs, over
        # every challenge in the repository, so nothing reaches a pull request that the check would reject
        if: ${{ steps.gen.outputs.published != '' && steps.gen.outputs.published != '0' }}
        env:
          ARCADE_PLUGIN: .plugin
        run: nvim --headless -u NONE -l scripts/validate.lua challenges,daily
      - name: Open a pull request with the new challenges
        id: pr
        if: ${{ steps.gen.outputs.published != '' && steps.gen.outputs.published != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ inputs.date }}
          ON_DEMAND: ${{ inputs.count || inputs.areas || inputs.levels || inputs.languages || inputs.theme }}
        run: |
          day="${DAY:-$(date -u +%Y-%m-%d)}"
          # an on-demand request gets its own branch and title, so it never replaces the day's open daily PR
          branch="daily/$day"; title="feat: daily challenges for $day"
          if [ -n "$ON_DEMAND" ]; then branch="ondemand/$day-$GITHUB_RUN_ID"; title="feat: on-demand challenges ($day)"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add daily
          git commit -m "$title"
          git push --force origin "$branch" # bot-owned branch: a rerun replaces it
          # the self-hosted runner has no gh CLI, so call the REST API with node (set up above)
          TITLE="$title" HEAD="$branch" node -e '
            const fs = require("fs")
            const body = fs.readFileSync(process.env.RUNNER_TEMP + "/pr-body.md", "utf8")
            fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls`, {
              method: "POST",
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json", "content-type": "application/json" },
              body: JSON.stringify({ title: process.env.TITLE, head: process.env.HEAD, base: "main", body }),
            }).then(async (r) => {
              const j = await r.json()
              if (!r.ok && !JSON.stringify(j).includes("already exists")) { console.error(r.status, JSON.stringify(j).slice(0, 300)); process.exit(1) }
              console.log(j.html_url ?? "pull request already open")
            })
          '
      - name: Run the validation checks on the new branch
        # a pull request opened with the job's own token does not start the "validate challenges" workflow, so start it
        # here: its check runs attach to the branch's commit and show up on the pull request
        if: ${{ steps.pr.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ inputs.date }}
          ON_DEMAND: ${{ inputs.count || inputs.areas || inputs.levels || inputs.languages || inputs.theme }}
        run: |
          day="${DAY:-$(date -u +%Y-%m-%d)}"
          branch="daily/$day"
          if [ -n "$ON_DEMAND" ]; then branch="ondemand/$day-$GITHUB_RUN_ID"; fi
          REF="$branch" node -e '
            fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/validate.yml/dispatches`, {
              method: "POST",
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json", "content-type": "application/json" },
              body: JSON.stringify({ ref: process.env.REF }),
            }).then((r) => {
              if (r.status !== 204) { console.error("could not start the checks:", r.status); process.exit(1) }
              console.log("validation started on", process.env.REF)
            })
          '
