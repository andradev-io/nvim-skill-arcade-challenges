name: validate challenges

on:
  pull_request:
    paths:
      - "challenges/**"
      - "daily/**"
      - "src/**"
      - "package*.json"
      - "index.html"
      - "vite.config.ts"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the engine that judges challenges is the plugin itself
      - uses: actions/checkout@v4
        with:
          repository: andradev-io/nvim-skill-arcade
          path: .plugin
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Schema check + replay every reference solution
        run: ARCADE_PLUGIN=.plugin nvim --headless -u NONE -l scripts/validate.lua challenges,daily
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the daily prompt files must still render (an unknown placeholder fails here, not at 04:17)
      - name: Daily prompt renders
        run: ARCADE_PLUGIN=.plugin node scripts/generate-daily.mjs --print-prompt > /dev/null

  site:
    # the React site: lint, typecheck, unit tests and a production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
