name: publish site and bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dev-vinicius-andrade/nvim-skill-arcade
          path: .plugin
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Build the bundle (fails if any challenge is invalid)
        run: ARCADE_PLUGIN=.plugin nvim --headless -u NONE -l scripts/build.lua challenges _site/community.json
      - name: Assemble the site
        run: cp -r site/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
