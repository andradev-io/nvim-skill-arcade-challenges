name: publish site and bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dev-vinicius-andrade/nvim-skill-arcade
          path: .plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the site
        run: npm run build
        env:
          # Sign-in settings come from GitHub secrets, so they are not in the repository. They end up in the built
          # JavaScript (a browser needs them to log in). Without them the site builds with the login hidden.
          VITE_KEYCLOAK_ISSUER: ${{ secrets.KEYCLOAK_ISSUER }}
          VITE_ARCADE_API: ${{ secrets.ARCADE_API_URL }}
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Build the bundle (fails if any challenge is invalid)
        run: ARCADE_PLUGIN=.plugin nvim --headless -u NONE -l scripts/build.lua challenges,daily dist/community.json
      - name: Export the built-in challenges (home page counts, Terminal buffers)
        run: ARCADE_PLUGIN=.plugin nvim --headless -u NONE -l scripts/stats.lua dist/stats.json dist/builtin.json dist/community.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
