name: deploy score worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Put the database id (a GitHub secret) into the config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "Add the D1_DATABASE_ID secret (the id printed by 'wrangler d1 create')." >&2
            exit 1
          fi
          sed -i "s/REPLACE_WITH_THE_ID_FROM_wrangler_d1_create/$D1_DATABASE_ID/" worker/wrangler.toml
      - name: Deploy (schema is idempotent, applied first)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          preCommands: npx wrangler d1 execute skill-arcade --remote --file=schema.sql
          command: deploy
          secrets: |
            USER_CODE_SALT
        env:
          USER_CODE_SALT: ${{ secrets.USER_CODE_SALT }}
