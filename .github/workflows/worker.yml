name: deploy score worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Config must be filled in
        run: |
          if grep -q REPLACE worker/wrangler.toml; then
            echo "worker/wrangler.toml still has REPLACE placeholders (database_id)." >&2
            exit 1
          fi
      - name: Deploy (schema is idempotent, applied first)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          preCommands: npx wrangler d1 execute skill-arcade --remote --file=schema.sql
          command: deploy
          secrets: |
            USER_CODE_SALT
        env:
          USER_CODE_SALT: ${{ secrets.USER_CODE_SALT }}
