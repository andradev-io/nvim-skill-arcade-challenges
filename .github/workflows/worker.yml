name: deploy score worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the admin secret is there
        env:
          ADMIN_USER_CODES: ${{ secrets.ADMIN_USER_CODES }}
        run: |
          if [ -z "$ADMIN_USER_CODES" ]; then echo "Add the ADMIN_USER_CODES secret: your player code (see worker/README.md)." >&2; exit 1; fi
      - name: Put the private config (GitHub secrets) into wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KEYCLOAK_ISSUER: ${{ secrets.KEYCLOAK_ISSUER }}
        run: |
          for v in D1_DATABASE_ID KEYCLOAK_ISSUER; do
            if [ -z "${!v}" ]; then echo "Add the $v secret (see worker/README.md)." >&2; exit 1; fi
          done
          sed -i "s|REPLACE_WITH_THE_ID_FROM_wrangler_d1_create|$D1_DATABASE_ID|; s|REPLACE_KEYCLOAK_ISSUER|$KEYCLOAK_ISSUER|" worker/wrangler.toml
      - name: Deploy (schema is idempotent, applied first)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          preCommands: npx wrangler d1 execute skill-arcade --remote --file=schema.sql
          command: deploy
          secrets: |
            USER_CODE_SALT
            ADMIN_USER_CODES
        env:
          USER_CODE_SALT: ${{ secrets.USER_CODE_SALT }}
          ADMIN_USER_CODES: ${{ secrets.ADMIN_USER_CODES }}
