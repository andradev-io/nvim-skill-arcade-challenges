name = "skill-arcade-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fill these in, then: npx wrangler d1 create skill-arcade && npx wrangler d1 execute skill-arcade --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "skill-arcade"
database_id = "REPLACE_WITH_THE_ID_FROM_wrangler_d1_create"

[vars]
# The realm issuer, exactly as in its openid-configuration (no trailing slash). The deploy workflow fills it in
# from the KEYCLOAK_ISSUER secret; for a manual deploy put it here, but do not commit it.
KEYCLOAK_ISSUER = "REPLACE_KEYCLOAK_ISSUER"
# Client ids allowed to call the API: the site and the plugin (device flow).
ALLOWED_CLIENTS = "arcade-site,arcade-plugin"
# The repository whose "daily challenges" workflow the Admin page starts (the token is the GITHUB_DISPATCH_TOKEN secret).
GITHUB_REPO = "andradev-io/nvim-skill-arcade-challenges"
ALLOWED_ORIGINS = "https://arcade.nvim.andradev.io,http://localhost:5173,http://localhost:5197"

# The API's own address. Cloudflare creates the DNS record and certificate for it on deploy (the andradev.io zone must
# be in this account). The name is three labels deep, so the free Universal certificate does not cover it: it needs
# an Advanced certificate for *.arcade.nvim.andradev.io (the CA must be allowed by the CAA records the CNAME of
# arcade.nvim.andradev.io inherits from GitHub Pages, e.g. Let's Encrypt).
routes = [{ pattern = "api.arcade.nvim.andradev.io", custom_domain = true }]
