name = "skill-arcade-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fill these in, then: npx wrangler d1 create skill-arcade && npx wrangler d1 execute skill-arcade --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "skill-arcade"
database_id = "ad06d99f-0b14-4d59-b831-a3d26d4b1127"

[vars]
# The realm issuer, exactly as in its openid-configuration (no trailing slash). The deploy workflow fills it in
# from the KEYCLOAK_ISSUER secret; for a manual deploy put it here, but do not commit it.
KEYCLOAK_ISSUER = "REPLACE_KEYCLOAK_ISSUER"
# Client ids allowed to call the API: the site and the plugin (device flow).
ALLOWED_CLIENTS = "arcade-site,arcade-plugin"
ALLOWED_ORIGINS = "https://arcade.nvim.andradev.io,http://localhost:5173,http://localhost:5197"

# Optional: run the API on the site's own hostname, so the browser needs no CORS.
# routes = [{ pattern = "arcade.nvim.andradev.io/api/*", zone_name = "andradev.io" }]
